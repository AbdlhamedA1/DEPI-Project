name: Continuous Integration & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Dependency Validation & Security Audit
  # ============================================================================
  dependency-audit:
    name: Dependency Audit & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --omit=dev --audit-level=critical || echo "Audit completed with non-blocking warnings"

  # ============================================================================
  # Stage 2: Code Quality (Lint, Format, Type-Check)
  # ============================================================================
  code-quality:
    name: Lint, Format & Strict Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prettier Format Check
        run: npm run format

      - name: Monorepo Code Linting
        run: npm run lint

      - name: Monorepo Strict Type-Check
        run: npm run type-check

  # ============================================================================
  # Stage 3: Backend Jest Test Suite
  # ============================================================================
  unit-tests:
    name: Backend Jest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Run Backend Tests
        run: npm test

  # ============================================================================
  # Stage 4: Full E2E Verification (Tiers 1 - 4, 341 Tests)
  # ============================================================================
  e2e-verification:
    name: Full E2E Test Suite (Tiers 1-4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Run Comprehensive E2E Runner
        run: npx tsx tests/runner.ts

  # ============================================================================
  # Stage 5: Production Multi-App Build
  # ============================================================================
  build-apps:
    name: Production Multi-App Build
    needs: [code-quality, unit-tests, e2e-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Packages & Applications
        run: npm run build

      - name: Upload Build Artifacts (API dist)
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          retention-days: 7

  # ============================================================================
  # Stage 6: Docker Container Build Validation
  # ============================================================================
  docker-validation:
    name: Docker Build Validation (API & Web)
    needs: [build-apps]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: student-housing-api:validate
          load: true

      - name: Build Web Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: student-housing-web:validate
          load: true

      - name: Validate Non-Root Execution
        run: |
          echo "Verifying API container user..."
          API_USER=$(docker run --rm student-housing-api:validate whoami)
          echo "API Container runs as user: $API_USER"
          if [ "$API_USER" = "root" ]; then
            echo "ERROR: API container must not run as root!"
            exit 1
          fi
