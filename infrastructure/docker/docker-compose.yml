version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: student_housing_db
    environment:
      POSTGRES_DB: student_housing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d student_housing']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: student_housing_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/student_housing?schema=public
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: student_housing
      JWT_SECRET: dev-jwt-super-secret-key-min-32-chars-long
    ports:
      - '3001:3001'
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: student_housing_web
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: ar
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres_data:
