name: Deployment Gateway

on:
  workflow_run:
    workflows: ["Continuous Integration & Quality Gate"]
    branches: [main]
    types:
      - completed

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Acknowledge CI Pass and Trigger Deploy
        run: echo "CI completed successfully on main. Deployment pipeline ready."
